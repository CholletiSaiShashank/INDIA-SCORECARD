<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>India T20 Cricket Universe</title>
<style>
:root{--navy:#0a1628;--navy2:#122038;--orange:#ff6a00;--white:#f3f6fb;--muted:#8fa1bd;--border:#22314d;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--navy:#0a1628;--navy2:#122038;--white:#f3f6fb;}}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--white);font-family:system-ui,Segoe UI,Arial,sans-serif;min-height:100%}
html,body{height:100%}
#layout{display:flex;min-height:100vh}
#side{width:230px;background:var(--navy2);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;overflow-x:auto}
#side h1{font-size:15px;padding:0 16px 16px;color:var(--orange);border-bottom:1px solid var(--border);margin:0 0 8px}
#side button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:10px 16px;cursor:pointer;font-size:13.5px}
#side button:hover,#side button.active{background:#1a2b4a;color:var(--white)}
#main{flex:1;padding:20px;overflow-x:auto;max-width:100%}
h2{color:var(--orange);margin-top:0}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:left}
th{background:#152541;color:var(--orange)}
.card{background:var(--navy2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.cards{display:flex;gap:10px;flex-wrap:wrap}
.cards .card{flex:1;min-width:140px}
.cards .card b{font-size:22px;display:block;color:var(--orange)}
input,select{background:#0e1c33;border:1px solid var(--border);color:var(--white);padding:5px 7px;border-radius:4px;font-size:13px}
button.btn{background:var(--orange);color:#111;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:600;font-size:13px}
button.btn.secondary{background:#1a2b4a;color:var(--white)}
button.btn.small{padding:3px 8px;font-size:12px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row>div{min-width:120px}
.warn{color:#ffb347;font-size:12px}
.badge{background:var(--orange);color:#111;border-radius:10px;padding:1px 7px;font-size:11px}
a.link{color:var(--orange);cursor:pointer;text-decoration:underline}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{white-space:nowrap}
::-webkit-scrollbar{height:8px;width:8px}
</style>
</head>
<body>
<div id="layout">
<div id="side">
<h1>🏏 INDIA T20 UNIVERSE</h1>
<div id="nav"></div>
</div>
<div id="main"></div>
</div>
<script>
/* ================= DATA ================= */
const LS_KEYS=['indiaPlayers','opponents','series','matches','settings'];
let DB={indiaPlayers:[],opponents:[],series:[],matches:[],settings:{}};
function loadAll(){LS_KEYS.forEach(k=>{const v=localStorage.getItem('t20u_'+k);DB[k]=v?JSON.parse(v):(k==='settings'?{}:[]);});}
function saveAll(){LS_KEYS.forEach(k=>localStorage.setItem('t20u_'+k,JSON.stringify(DB[k])));}
function uid(p){return p+'_'+Math.random().toString(36).slice(2,10);}
loadAll();

/* ================= CRICKET LOGIC ================= */
function oversToBalls(overs){
  overs=parseFloat(overs);if(isNaN(overs)||overs<0)return null;
  const o=Math.floor(overs+1e-9);const b=Math.round((overs-o)*10);
  if(b>5)return null; // invalid ball digit
  return o*6+b;
}
function ballsToOvers(balls){if(balls==null||isNaN(balls))return '0.0';const o=Math.floor(balls/6);const b=balls%6;return o+'.'+b;}
function canBat(p){return true;}
function canBowl(p){return p.role==='Bowler'||p.role==='All-Rounder';}
function economy(runs,balls){if(!balls)return 0;return runs/(balls/6);}
const INTENSITY={'Series Match':1.00,'Quarter Final':1.25,'Semi Final':1.50,'Final':1.75};

/* ================= NAV ================= */
const VIEWS=[['dashboard','Dashboard'],['players','Indian Players'],['opponents','Opponents'],
['series','Series & Competitions'],['creatematch','Create Match'],['history','Match History'],
['points','Points Table'],['orange','Orange Cap'],['purple','Purple Cap'],['battingrank','Batting Rankings'],
['bowlingrank','Bowling Rankings'],['captaincy','Captaincy Records'],['stats','Statistics'],['settings','Settings']];
let CUR='dashboard';let params={};
function nav(v,p){CUR=v;params=p||{};render();}
function renderNav(){
  document.getElementById('nav').innerHTML=VIEWS.map(([id,label])=>
    `<button class="${CUR===id?'active':''}" onclick="nav('${id}')">${label}</button>`).join('');
}

/* ================= STAT ENGINE ================= */
function playerMatches(pid){return DB.matches.filter(m=>m.playingXI.some(x=>x.playerId===pid&&x.played));}
function battingCareer(pid,matchFilter){
  const ms=(matchFilter||DB.matches);
  let innings=0,runs=0,balls=0,notOuts=0,hs=0,fifties=0,hundreds=0,fours=0,sixes=0,matches=0;
  ms.forEach(m=>{
    const played=m.playingXI.find(x=>x.playerId===pid&&x.played);
    if(!played)return;matches++;
    const b=m.indianBatting.find(x=>x.playerId===pid);
    if(b){innings++;runs+=b.runs;balls+=b.balls;fours+=b.fours;sixes+=b.sixes;
      if(b.notOut)notOuts++;if(b.runs>hs)hs=b.runs;if(b.runs>=100)hundreds++;else if(b.runs>=50)fifties++;}
  });
  const dismissals=innings-notOuts;
  return {matches,innings,runs,balls,notOuts,hs,fifties,hundreds,fours,sixes,dismissals,
    avg:dismissals>0?(runs/dismissals):null, sr:balls>0?(runs/balls*100):null};
}
function bowlingCareer(pid,matchFilter){
  const ms=(matchFilter||DB.matches);
  let innings=0,balls=0,maidens=0,runs=0,wkts=0,matches=0,best='-',w3=0,w4=0,w5=0;
  ms.forEach(m=>{
    const played=m.playingXI.find(x=>x.playerId===pid&&x.played);
    if(!played)return;matches++;
    const b=m.indianBowling.find(x=>x.playerId===pid);
    if(b){innings++;balls+=b.balls;maidens+=b.maidens;runs+=b.runs;wkts+=b.wickets;
      if(b.wickets>=5)w5++;else if(b.wickets>=4)w4++;else if(b.wickets>=3)w3++;
      if(best==='-'||b.wickets>parseInt(best)||(b.wickets===parseInt(best)&&b.runs<parseInt(best.split('/')[1])))
        best=b.wickets+'/'+b.runs;}
  });
  return {matches,innings,balls,maidens,runs,wkts,best,w3,w4,w5,
    econ:balls>0?economy(runs,balls):null, avg:wkts>0?(runs/wkts):null};
}
function matchResult(m){
  const ir=m.indiaScore.runs,or=m.oppScore.runs;
  if(m.result&&m.result.type)return m.result;
  if(ir>or)return {type:'won',text:'India won by '+(ir-or)+' runs'};
  if(or>ir)return {type:'lost',text:'India lost by '+(10-m.indiaScore.wickets)+' wickets'};
  return {type:'tie',text:'Match tied'};
}
function teamRunRate(runs,balls){return balls>0?runs/(balls/6):0;}
function matchNRR(m){
  let indiaBalls=m.indiaScore.balls, oppBalls=m.oppScore.balls;
  if(m.indiaScore.wickets>=10) indiaBalls=120; // all out -> full quota
  if(m.oppScore.wickets>=10) oppBalls=120;
  const rf=teamRunRate(m.indiaScore.runs,indiaBalls);
  const ra=teamRunRate(m.oppScore.runs,oppBalls);
  return {rf,ra,indiaBalls,oppBalls};
}

/* Rankings with match-based decay, chronological */
function computeRankings(kind){ // kind: 'bat' or 'bowl'
  const players=DB.indiaPlayers.filter(p=>kind==='bat'?true:canBowl(p));
  const state={};players.forEach(p=>state[p.id]={points:1000,lastMatch:null,missed:0,hasPlayed:false});
  const ms=[...DB.matches].sort((a,b)=>new Date(a.date)-new Date(b.date));
  ms.forEach(m=>{
    const intensity=m.intensityMultiplier||INTENSITY[m.stage]||1;
    players.forEach(p=>{
      const s=state[p.id];
      const inXI=m.playingXI.find(x=>x.playerId===p.id&&x.played);
      if(inXI){
        let pts=0;
        if(kind==='bat'){
          const b=m.indianBatting.find(x=>x.playerId===p.id);
          if(b){const sr=b.balls>0?(b.runs/b.balls*100):0;
            pts=b.runs*1.0+b.fours*1.5+b.sixes*2.0+(sr>100?(sr-100)*0.2:0)+
              (b.runs>=50?20:0)+(b.runs>=100?50:0)+(b.notOut?10:0);}
        }else{
          const bw=m.indianBowling.find(x=>x.playerId===p.id);
          if(bw){const econ=bw.balls>0?economy(bw.runs,bw.balls):0;
            pts=bw.wickets*25+bw.maidens*5+(econ<6&&bw.balls>0?(6-econ)*5:0)+
              (bw.wickets>=3?20:0)+(bw.wickets>=4?35:0)+(bw.wickets>=5?50:0);}
        }
        s.points+=pts*intensity;s.missed=0;s.lastMatch=m.date;s.hasPlayed=true;
      }else if(s.hasPlayed){
        s.missed+=1;s.points*=0.98;
      }
    });
  });
  return players.map(p=>({player:p,...state[p.id]})).sort((a,b)=>b.points-a.points);
}

function captaincyRecord(cid){
  const ms=DB.matches.filter(m=>m.captainId===cid).sort((a,b)=>new Date(a.date)-new Date(b.date));
  let wins=0,losses=0,ties=0,nr=0,runsFor=0,runsAg=0,ballsFor=0,ballsAg=0,points=0;
  ms.forEach(m=>{
    const r=matchResult(m);
    if(r.type==='won'){wins++;points+=2;}else if(r.type==='lost'){losses++;}
    else if(r.type==='tie'){ties++;points+=1;}else{nr++;points+=1;}
    const n=matchNRR(m);runsFor+=m.indiaScore.runs;runsAg+=m.oppScore.runs;
    ballsFor+=n.indiaBalls;ballsAg+=n.oppBalls;
  });
  const nrr=(teamRunRate(runsFor,ballsFor)-teamRunRate(runsAg,ballsAg));
  const bat=battingCareer(cid,ms), bowl=bowlingCareer(cid,ms);
  return {matches:ms.length,wins,losses,ties,nr,winPct:ms.length?((wins/ms.length)*100):0,points,nrr,bat,bowl,ms};
}

/* ================= RENDER ================= */
function esc(s){return (s||'').toString().replace(/</g,'&lt;');}
function fmt(n,d=2){return (n==null||isNaN(n))?'N/A':Number(n).toFixed(d);}

function render(){
  renderNav();
  const m=document.getElementById('main');
  const fns={dashboard:renderDashboard,players:renderPlayers,opponents:renderOpponents,series:renderSeries,
    creatematch:renderCreateMatch,history:renderHistory,points:renderPoints,orange:renderOrange,purple:renderPurple,
    battingrank:()=>renderRankView('bat'),bowlingrank:()=>renderRankView('bowl'),captaincy:renderCaptaincy,
    stats:renderStats,settings:renderSettings};
  m.innerHTML='';
  (fns[CUR]||renderDashboard)(m);
}

function renderDashboard(m){
  const totalRuns=DB.matches.reduce((s,x)=>s+x.indianBatting.reduce((a,b)=>a+b.runs,0),0);
  const totalWkts=DB.matches.reduce((s,x)=>s+x.indianBowling.reduce((a,b)=>a+b.wickets,0),0);
  const orange=[...DB.indiaPlayers].map(p=>({p,c:battingCareer(p.id)})).sort((a,b)=>b.c.runs-a.c.runs)[0];
  const purple=[...DB.indiaPlayers].filter(canBowl).map(p=>({p,c:bowlingCareer(p.id)})).sort((a,b)=>b.c.wkts-a.c.wkts)[0];
  m.innerHTML=`<h2>Dashboard</h2>
  <div class="cards">
    <div class="card">Indian Players<b>${DB.indiaPlayers.length}</b></div>
    <div class="card">Opponent Teams<b>${DB.opponents.length}</b></div>
    <div class="card">Series<b>${DB.series.length}</b></div>
    <div class="card">Matches<b>${DB.matches.length}</b></div>
    <div class="card">Total India Runs<b>${totalRuns}</b></div>
    <div class="card">Total India Wickets<b>${totalWkts}</b></div>
  </div>
  <div class="row">
    <div class="card" style="flex:1"><h3>Orange Cap Leader</h3>${orange&&orange.c.runs?esc(orange.p.name)+' — '+orange.c.runs+' runs':'No data yet'}</div>
    <div class="card" style="flex:1"><h3>Purple Cap Leader</h3>${purple&&purple.c.wkts?esc(purple.p.name)+' — '+purple.c.wkts+' wkts':'No data yet'}</div>
  </div>
  <p style="color:var(--muted);font-size:12px">Use the sidebar to manage players, create matches, and view rankings. See Settings to load demo data.</p>`;
}

/* --- Players --- */
function renderPlayers(m){
  m.innerHTML=`<h2>Indian Players</h2>
  <div class="card"><div class="row">
    <div><label>Name</label><input id="pname"></div>
    <div><label>Role</label><select id="prole"><option>Batter</option><option>Bowler</option><option>All-Rounder</option><option>Wicketkeeper</option></select></div>
    <div style="align-self:end"><button class="btn" onclick="addPlayer()">Add Player</button></div>
  </div></div>
  <table><tr><th>Name</th><th>Role</th><th>Active</th><th>Matches</th><th>Runs</th><th>Wkts</th><th>Actions</th></tr>
  ${DB.indiaPlayers.map(p=>{const bc=battingCareer(p.id),bw=canBowl(p)?bowlingCareer(p.id):null;
    return `<tr><td><a class="link" onclick="nav('profile_${p.id}')">${esc(p.name)}</a></td>
    <td>${p.role}</td><td>${p.active?'Active':'Inactive'}</td><td>${bc.matches}</td><td>${bc.runs}</td><td>${bw?bw.wkts:'-'}</td>
    <td>
    <button class="btn small secondary" onclick="editPlayer('${p.id}')">Edit</button>
    <button class="btn small secondary" onclick="toggleActive('${p.id}')">${p.active?'Deactivate':'Activate'}</button>
    <button class="btn small secondary" onclick="deletePlayer('${p.id}')">Delete</button>
    </td></tr>`;}).join('')}
  </table>`;
  if(CUR.startsWith('profile_'))renderPlayerProfile(m,CUR.split('_')[1]);
}
window.nav=nav;
function addPlayer(){
  const name=document.getElementById('pname').value.trim();
  const role=document.getElementById('prole').value;
  if(!name)return alert('Enter a name');
  DB.indiaPlayers.push({id:uid('p'),name,role,active:true});
  saveAll();render();
}
function editPlayer(id){
  const p=DB.indiaPlayers.find(x=>x.id===id);
  const name=prompt('Name',p.name);if(name===null)return;
  const role=prompt('Role (Batter/Bowler/All-Rounder/Wicketkeeper)',p.role);if(role===null)return;
  if(!['Batter','Bowler','All-Rounder','Wicketkeeper'].includes(role))return alert('Invalid role');
  p.name=name;p.role=role;saveAll();render();
}
function toggleActive(id){const p=DB.indiaPlayers.find(x=>x.id===id);p.active=!p.active;saveAll();render();}
function deletePlayer(id){if(confirm('Delete this player? Historical match records will keep the name reference.')){DB.indiaPlayers=DB.indiaPlayers.filter(x=>x.id!==id);saveAll();render();}}

function renderPlayerProfile(container,pid){
  const p=DB.indiaPlayers.find(x=>x.id===pid);if(!p)return;
  const bat=battingCareer(pid),bowl=canBowl(p)?bowlingCareer(pid):null;
  const rankBat=computeRankings('bat').find(r=>r.player.id===pid);
  const rankBowl=canBowl(p)?computeRankings('bowl').find(r=>r.player.id===pid):null;
  const cap=captaincyRecord(pid);
  const div=document.createElement('div');div.className='card';
  div.innerHTML=`<h3>${esc(p.name)} <span class="badge">${p.role}</span></h3>
  <p>Batting Rank Points: ${fmt(rankBat?rankBat.points:1000,1)} | Matches Missed: ${rankBat?rankBat.missed:0}
  ${rankBowl?' | Bowling Rank Points: '+fmt(rankBowl.points,1):''}</p>
  <h4>Career Batting</h4>
  <table><tr><th>M</th><th>Inn</th><th>Runs</th><th>Avg</th><th>SR</th><th>HS</th><th>50s</th><th>100s</th><th>4s</th><th>6s</th></tr>
  <tr><td>${bat.matches}</td><td>${bat.innings}</td><td>${bat.runs}</td><td>${fmt(bat.avg)}</td><td>${fmt(bat.sr)}</td><td>${bat.hs}</td><td>${bat.fifties}</td><td>${bat.hundreds}</td><td>${bat.fours}</td><td>${bat.sixes}</td></tr></table>
  ${bowl?`<h4>Career Bowling</h4><table><tr><th>M</th><th>Inn</th><th>Overs</th><th>Runs</th><th>Wkts</th><th>Econ</th><th>Avg</th><th>Best</th></tr>
  <tr><td>${bowl.matches}</td><td>${bowl.innings}</td><td>${ballsToOvers(bowl.balls)}</td><td>${bowl.runs}</td><td>${bowl.wkts}</td><td>${fmt(bowl.econ)}</td><td>${fmt(bowl.avg)}</td><td>${bowl.best}</td></tr></table>`:'<p>No bowling record — player is not eligible to bowl.</p>'}
  ${cap.matches?`<h4>Captaincy Record</h4><p>Captained ${cap.matches} | Won ${cap.wins} | Lost ${cap.losses} | Win% ${fmt(cap.winPct,1)} | NRR ${fmt(cap.nrr)}</p>`:''}
  <button class="btn secondary" onclick="nav('players')">Back</button>`;
  container.appendChild(div);
}

/* --- Opponents --- */
function renderOpponents(m){
  m.innerHTML=`<h2>Opponent Teams</h2>
  <div class="card"><div class="row"><div><label>Team Name</label><input id="oname"></div>
  <div><label>Short</label><input id="oshort" maxlength="4"></div>
  <div style="align-self:end"><button class="btn" onclick="addOpponent()">Add Team</button></div></div></div>
  <table><tr><th>Name</th><th>Short</th><th></th></tr>
  ${DB.opponents.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.short)}</td><td><button class="btn small secondary" onclick="deleteOpponent('${o.id}')">Delete</button></td></tr>`).join('')}</table>`;
}
function addOpponent(){
  const name=document.getElementById('oname').value.trim(),short=document.getElementById('oshort').value.trim().toUpperCase();
  if(!name)return alert('Enter a team name');
  DB.opponents.push({id:uid('o'),name,short:short||name.slice(0,3).toUpperCase()});saveAll();render();
}
function deleteOpponent(id){if(confirm('Delete team?')){DB.opponents=DB.opponents.filter(x=>x.id!==id);saveAll();render();}}

/* --- Series --- */
function renderSeries(m){
  m.innerHTML=`<h2>Series & Competitions</h2>
  <div class="card"><div class="row">
  <div><label>Name</label><input id="sname"></div>
  <div><label>Type</label><select id="stype"><option>Bilateral</option><option>Tournament</option></select></div>
  <div><label>Start</label><input type="date" id="sstart"></div>
  <div><label>End</label><input type="date" id="send"></div>
  <div style="align-self:end"><button class="btn" onclick="addSeries()">Add Series</button></div>
  </div></div>
  <table><tr><th>Name</th><th>Type</th><th>Start</th><th>End</th><th></th></tr>
  ${DB.series.map(s=>`<tr><td><a class="link" onclick="nav('points',{seriesId:'${s.id}'})">${esc(s.name)}</a></td><td>${s.type}</td><td>${s.start||''}</td><td>${s.end||''}</td>
  <td><button class="btn small secondary" onclick="deleteSeries('${s.id}')">Delete</button></td></tr>`).join('')}</table>`;
}
function addSeries(){
  const name=document.getElementById('sname').value.trim();
  if(!name)return alert('Enter a series name');
  DB.series.push({id:uid('s'),name,type:document.getElementById('stype').value,
    start:document.getElementById('sstart').value,end:document.getElementById('send').value});
  saveAll();render();
}
function deleteSeries(id){if(confirm('Delete series?')){DB.series=DB.series.filter(x=>x.id!==id);saveAll();render();}}

/* --- Create Match --- */
let draftMatch=null;
function newDraft(){
  draftMatch={id:uid('m'),date:new Date().toISOString().slice(0,10),seriesId:'',opponentId:'',stage:'Series Match',
    captainId:'',playingXI:[],indiaScore:{runs:0,wickets:0,balls:0},oppScore:{runs:0,wickets:0,balls:0},
    indianBatting:[],indianBowling:[]};
}
function renderCreateMatch(m){
  if(!draftMatch)newDraft();
  const d=draftMatch;
  if(!DB.opponents.length||!DB.indiaPlayers.length){
    m.innerHTML=`<h2>Create Match</h2><p class="warn">Add at least one Opponent Team and some Indian Players first.</p>`;return;
  }
  const intensity=INTENSITY[d.stage];
  const xiIds=d.playingXI.filter(x=>x.played).map(x=>x.playerId);
  const bowlEligible=DB.indiaPlayers.filter(p=>xiIds.includes(p.id)&&canBowl(p));
  m.innerHTML=`<h2>Create Match — India vs [Opponent]</h2>
  <div class="card">
  <div class="row">
    <div><label>Opponent</label><select id="mopp" onchange="draftMatch.opponentId=this.value">
      <option value="">Select</option>${DB.opponents.map(o=>`<option value="${o.id}" ${d.opponentId===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div>
    <div><label>Series</label><select id="mser" onchange="draftMatch.seriesId=this.value">
      <option value="">None</option>${DB.series.map(s=>`<option value="${s.id}" ${d.seriesId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    <div><label>Date</label><input type="date" value="${d.date}" onchange="draftMatch.date=this.value"></div>
    <div><label>Stage</label><select onchange="draftMatch.stage=this.value;render()">
      ${Object.keys(INTENSITY).map(s=>`<option ${d.stage===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div><label>Intensity</label><input disabled value="${intensity.toFixed(2)}x"></div>
  </div></div>

  <div class="card"><h3>India Playing XI</h3>
  <table><tr><th>Played</th><th>Player</th><th>Role</th><th>Captain</th></tr>
  ${DB.indiaPlayers.filter(p=>p.active).map(p=>{
    const xi=d.playingXI.find(x=>x.playerId===p.id)||{playerId:p.id,played:false,captain:false};
    return `<tr><td><input type="checkbox" ${xi.played?'checked':''} onchange="toggleXI('${p.id}',this.checked)"></td>
    <td>${esc(p.name)}</td><td>${p.role}</td>
    <td><input type="checkbox" ${d.captainId===p.id?'checked':''} onchange="setCaptain('${p.id}',this.checked)"></td></tr>`;

function toggleXI(pid,played){
  let x=draftMatch.playingXI.find(x=>x.playerId===pid);
  if(!x){x={playerId:pid,played:false,captain:false};draftMatch.playingXI.push(x);}
  x.played=played;
  if(!played&&draftMatch.captainId===pid)draftMatch.captainId='';
  render();
}
function setCaptain(pid,checked){
  if(checked){
    const xi=draftMatch.playingXI.find(x=>x.playerId===pid);
    if(!xi||!xi.played){alert('Captain must be in the Playing XI (Played=true).');render();return;}
    draftMatch.captainId=pid;
  }else if(draftMatch.captainId===pid)draftMatch.captainId='';
  render();
}
function setBalls(which,val){
  const b=oversToBalls(val);
  if(b===null){alert('Invalid overs. Ball digit must be 0-5 (e.g. 4.6 is invalid).');render();return;}
  if(b>120){alert('Overs cannot exceed 20.0 in a T20 innings.');render();return;}
  if(which==='india')draftMatch.indiaScore.balls=b;else draftMatch.oppScore.balls=b;
}
function addBatting(){
  const pid=document.getElementById('bat_p').value;
  if(!pid)return alert('Select a player. Add players to the Playing XI first.');
  const runs=+document.getElementById('bat_r').value,balls=+document.getElementById('bat_b').value,
    f=+document.getElementById('bat_4').value,s=+document.getElementById('bat_6').value,
    notOut=document.getElementById('bat_no').checked;
  if(runs<0||balls<0||f<0||s<0)return alert('Values cannot be negative.');
  if(f*4+s*6>runs)alert('Warning: 4s and 6s runs exceed total runs — entry saved anyway, please review.');
  if(draftMatch.indianBatting.find(x=>x.playerId===pid))return alert('Player already has a batting entry.');
  draftMatch.indianBatting.push({playerId:pid,runs,balls,fours:f,sixes:s,notOut});
  render();
}
function removeBatting(i){draftMatch.indianBatting.splice(i,1);render();}
function addBowling(){
  const pid=document.getElementById('bowl_p').value;
  if(!pid)return alert('No bowl-eligible player available. Only Bowlers/All-Rounders in the Playing XI can bowl.');
  const p=DB.indiaPlayers.find(x=>x.id===pid);
  if(!canBowl(p))return alert('This player is not eligible to bowl (Batter/Wicketkeeper).');
  const balls=oversToBalls(document.getElementById('bowl_o').value);
  if(balls===null)return alert('Invalid overs format.');
  const m=+document.getElementById('bowl_m').value,r=+document.getElementById('bowl_r').value,w=+document.getElementById('bowl_w').value;
  if(m<0||r<0||w<0)return alert('Values cannot be negative.');
  if(w>10)return alert('Wickets cannot exceed 10.');
  if(draftMatch.indianBowling.find(x=>x.playerId===pid))return alert('Player already has a bowling entry.');
  draftMatch.indianBowling.push({playerId:pid,balls,maidens:m,runs:r,wickets:w});
  render();
}
function removeBowling(i){draftMatch.indianBowling.splice(i,1);render();}
function saveMatch(){
  const d=draftMatch;
  if(!d.opponentId)return alert('Select an opponent.');
  if(!d.captainId)return alert('Select exactly one captain from the Playing XI.');
  d.intensityMultiplier=INTENSITY[d.stage];
  d.result=matchResult(d);
  DB.matches.push(JSON.parse(JSON.stringify(d)));
  saveAll();newDraft();alert('Match saved.');nav('history');
}

/* --- Points Table --- */
function renderPoints(m){
  const sel=params.seriesId||'';
  m.innerHTML=`<h2>Points Table</h2>
  <div class="card"><label>Competition</label><select onchange="nav('points',{seriesId:this.value})">
  <option value="">All matches</option>${DB.series.map(s=>`<option value="${s.id}" ${sel===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
  <div id="ptable"></div>`;
  const ms=DB.matches.filter(x=>!sel||x.seriesId===sel);
  const teams={INDIA:{name:'India',played:0,won:0,lost:0,tied:0,nr:0,points:0,runsFor:0,runsAg:0,ballsFor:0,ballsAg:0}};
  ms.forEach(mt=>{
    const opp=DB.opponents.find(o=>o.id===mt.opponentId);if(!opp)return;
    if(!teams[opp.id])teams[opp.id]={name:opp.name,played:0,won:0,lost:0,tied:0,nr:0,points:0,runsFor:0,runsAg:0,ballsFor:0,ballsAg:0};
    const r=matchResult(mt);const n=matchNRR(mt);
    teams.INDIA.played++;teams[opp.id].played++;
    teams.INDIA.runsFor+=mt.indiaScore.runs;teams.INDIA.runsAg+=mt.oppScore.runs;
    teams.INDIA.ballsFor+=n.indiaBalls;teams.INDIA.ballsAg+=n.oppBalls;
    teams[opp.id].runsFor+=mt.oppScore.runs;teams[opp.id].runsAg+=mt.indiaScore.runs;
    teams[opp.id].ballsFor+=n.oppBalls;teams[opp.id].ballsAg+=n.indiaBalls;
    if(r.type==='won'){teams.INDIA.won++;teams.INDIA.points+=2;teams[opp.id].lost++;}
    else if(r.type==='lost'){teams.INDIA.lost++;teams[opp.id].won++;teams[opp.id].points+=2;}
    else if(r.type==='tie'){teams.INDIA.tied++;teams[opp.id].tied++;teams.INDIA.points+=1;teams[opp.id].points+=1;}
    else{teams.INDIA.nr++;teams[opp.id].nr++;teams.INDIA.points+=1;teams[opp.id].points+=1;}
  });
  const rows=Object.values(teams).map(t=>({...t,nrr:teamRunRate(t.runsFor,t.ballsFor)-teamRunRate(t.runsAg,t.ballsAg)}))
    .sort((a,b)=>b.points-a.points||b.nrr-a.nrr);
  document.getElementById('ptable').innerHTML=`<table><tr><th>Pos</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>NR</th><th>Pts</th><th>NRR</th></tr>
  ${rows.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.name)}</td><td>${t.played}</td><td>${t.won}</td><td>${t.lost}</td><td>${t.tied}</td><td>${t.nr}</td><td>${t.points}</td><td>${(t.nrr>=0?'+':'')+fmt(t.nrr)}</td></tr>`).join('')}
  </table>`;
}

/* --- Statistics leaderboards --- */
function renderStats(m){
  const bat=DB.indiaPlayers.map(p=>({p,c:battingCareer(p.id)}));
  const bowl=DB.indiaPlayers.filter(canBowl).map(p=>({p,c:bowlingCareer(p.id)}));
  const sr=bat.filter(r=>r.c.balls>=100).sort((a,b)=>b.c.sr-a.c.sr).slice(0,10);
  const avg=bat.filter(r=>r.c.dismissals>=5).sort((a,b)=>b.c.avg-a.c.avg).slice(0,10);
  const most50=bat.filter(r=>r.c.fifties>0).sort((a,b)=>b.c.fifties-a.c.fifties).slice(0,10);
  const most100=bat.filter(r=>r.c.hundreds>0).sort((a,b)=>b.c.hundreds-a.c.hundreds).slice(0,10);
  const most4=bat.filter(r=>r.c.fours>0).sort((a,b)=>b.c.fours-a.c.fours).slice(0,10);
  const most6=bat.filter(r=>r.c.sixes>0).sort((a,b)=>b.c.sixes-a.c.sixes).slice(0,10);
  const econ=bowl.filter(r=>r.c.balls>=300).sort((a,b)=>a.c.econ-b.c.econ).slice(0,10);
  const bavg=bowl.filter(r=>r.c.wkts>=10).sort((a,b)=>a.c.avg-b.c.avg).slice(0,10);
  const sec=(title,rows,cols,get)=>`<div class="card"><h3>${title}</h3><table><tr><th>Player</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>
  ${rows.map(r=>`<tr><td>${esc(r.p.name)}</td>${get(r).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="'+(cols.length+1)+'">No qualifying players yet</td></tr>'}</table></div>`;
  m.innerHTML=`<h2>Statistics</h2>
  <div class="card"><b>How Statistics Work:</b> Strike Rate = Runs/Balls×100. Average = Runs/Dismissals (N/A if 0 dismissals). Economy = Runs/(Balls/6). For NRR, a team all out before 20 overs is treated as having used the full 20-over (120 ball) quota.</div>
  ${sec('Highest Strike Rate (min 100 balls)',sr,['SR'],r=>[fmt(r.c.sr)])}
  ${sec('Highest Batting Average (min 5 dismissals)',avg,['Avg'],r=>[fmt(r.c.avg)])}
  ${sec('Most 50s',most50,['50s'],r=>[r.c.fifties])}
  ${sec('Most 100s',most100,['100s'],r=>[r.c.hundreds])}
  ${sec('Most 4s',most4,['4s'],r=>[r.c.fours])}
  ${sec('Most 6s',most6,['6s'],r=>[r.c.sixes])}
  ${sec('Best Economy (min 50 overs)',econ,['Econ'],r=>[fmt(r.c.econ)])}
  ${sec('Best Bowling Average (min 10 wkts)',bavg,['Avg'],r=>[fmt(r.c.avg)])}`;
}

function exportData(){

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='india-t20-universe-backup.json';a.click();
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{try{const data=JSON.parse(e.target.result);
    LS_KEYS.forEach(k=>{if(data[k]!==undefined)DB[k]=data[k];});saveAll();alert('Import successful.');render();
  }catch(err){alert('Invalid file.');}};
  reader.readAsText(f);
}

  if(confirm('This will delete ALL data. Continue?')){DB={indiaPlayers:[],opponents:[],series:[],matches:[],settings:{}};saveAll();render();}
}
